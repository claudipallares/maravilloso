const stage = document.getElementById('stage');
function resize(){
  const f = Math.min(innerWidth / W, innerHeight / H);
  const s = f >= 1 ? Math.floor(f) : f;
  cv.style.width = W*s + 'px'; cv.style.height = H*s + 'px';
  stage.style.width = W*s + 'px';
}
addEventListener('resize', resize); resize();


// ---------- MÚSICA I EFECTES (Web Audio, chiptune) ----------
let AC = null, master = null, muted = false, musicOn = false, nextNote = 0, step = 0;
try { muted = localStorage.getItem('pv_muted') === '1'; } catch(e){}
const BPM = 140, STEP = 60 / BPM / 2;           // corxeres
const N = n => 440 * Math.pow(2, (n - 69) / 12);  // MIDI -> Hz
// melodia original (32 corxeres), 0 = silenci
const MEL = [76,0,79,76, 74,72,74,0, 76,0,72,69, 67,0,69,72,
             76,0,79,81, 79,76,74,72, 74,0,76,74, 72,0,0,0];
const BASS = [45,45,52,45, 41,41,48,41, 43,43,50,43, 40,40,47,40];
function audioInit(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.18; master.connect(AC.destination);
  } catch(e) { AC = null; }
}
function tone(freq, t0, dur, type, vol){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
}
function musicTick(){
  if (!AC || !musicOn) return;
  while (nextNote < AC.currentTime + 0.15) {
    const m = MEL[step % MEL.length];
    if (m) tone(N(m), nextNote, STEP*0.9, 'square', 0.25);
    if (step % 2 === 0) tone(N(BASS[(step/2) % BASS.length]), nextNote, STEP*1.8, 'triangle', 0.5);
    nextNote += STEP; step++;
  }
}
function musicStart(){ if (!AC) return; musicOn = true; step = 0; nextNote = AC.currentTime + 0.05; }
function musicStop(){ musicOn = false; }
function sfx(kind){
  if (!AC) return; const t0 = AC.currentTime;
  if (kind === 'coin') { tone(N(88), t0, 0.06, 'square', 0.3); tone(N(93), t0+0.06, 0.12, 'square', 0.3); }
  if (kind === 'hit')  { tone(N(45), t0, 0.25, 'sawtooth', 0.5); tone(N(40), t0+0.08, 0.3, 'sawtooth', 0.4); }
  if (kind === 'win')  { [72,76,79,84].forEach((n,i) => tone(N(n), t0+i*0.12, 0.25, 'square', 0.3)); }
  if (kind === 'over') { [67,63,60,55].forEach((n,i) => tone(N(n), t0+i*0.15, 0.3, 'triangle', 0.5)); }
}
function toggleMute(){
  muted = !muted; try { localStorage.setItem('pv_muted', muted ? '1' : '0'); } catch(e){}
  if (master) master.gain.value = muted ? 0 : 0.18;
  document.getElementById('mute').textContent = muted ? '🔇' : '🔊';
}

// ---------- ESTAT ----------
let best = 0; try { best = +localStorage.getItem('pv_besttime') || 0; } catch(e){}
let vmT = 0;
let state = 'menu', got, lives, items, player, t, spawnT, speed, spawnEvery, hurtT;

function reset(){
  got = {btc: 0, eth: 0, vm: 0}; lives = START_LIVES; items = []; t = 0; spawnT = 0;
  speed = 80; spawnEvery = 0.7; hurtT = 0; vmT = spawnEvery / 2;
  player = {x: (W - SIZE.player.w)/2, vx: 0, frame: 0, animT: 0, face: 1};
}

// ---------- CONTROLS ----------
const keys = {left:false, right:false};
let touchDir = 0, touchStartX = null, dragging = false, lastGX = 0, dragDX = 0, dragMoveT = 0;
const SENS = 0.8;     // sensibilitat del moviment relatiu (1 = igual que el dit)
const SMOOTH = 12;    // suavitat: més baix = més suau
let dragTarget = null;
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') keys.left = true;
  if (e.key === 'ArrowRight') keys.right = true;
  if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') start();
  if (e.key === 'm' || e.key === 'M') toggleMute();
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
});
function toGameX(clientX){ const r = cv.getBoundingClientRect(); return (clientX - r.left) / r.width * W; }
const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('pointerdown', e => { e.stopPropagation(); audioInit(); toggleMute(); });
muteBtn.textContent = muted ? '🔇' : '🔊';
addEventListener('pointerdown', e => {
  if (state !== 'play') { start(); return; }
  touchStartX = e.clientX; dragging = false; lastGX = toGameX(e.clientX);
  touchDir = e.clientX < innerWidth/2 ? -1 : 1;
});
addEventListener('pointermove', e => {
  if (touchStartX === null) return;
  if (!dragging && Math.abs(e.clientX - touchStartX) > 6) { dragging = true; touchDir = 0; lastGX = toGameX(e.clientX); dragTarget = player.x; }
  if (dragging) { const gx = toGameX(e.clientX); dragDX += (gx - lastGX) * SENS; lastGX = gx; }
});
const end = () => { touchStartX = null; touchDir = 0; dragging = false; dragDX = 0; dragTarget = null; };
addEventListener('pointerup', end); addEventListener('pointercancel', end);

// ---------- LÒGICA ----------
function start(){ audioInit(); musicStart(); reset(); state = 'play'; msg(''); document.getElementById('winmsg').innerHTML = ''; }
function spawn(forced){
  const r = Math.random();
  const type = forced ? forced : r < 0.38 ? 'candle' : r < 0.50 ? 'btc' : r < 0.70 ? 'eth' : 'vm';   // ham 38%, BTC 12%, ETH 20%, VM 30%
  const s = SIZE[type];
  const x0 = Math.floor(8 + Math.random()*(W - s.w - 16));
  items.push({type, x: x0, x0, y: -s.h, v: speed * (0.85 + Math.random()*0.3),
              amp: type === 'candle' ? 6 + Math.random()*10 : 0, ph: Math.random()*6.28, fr: 1.5 + Math.random()*1.5});
}
function hit(a, b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

function update(dt){
  if (state !== 'play') return;
  t += dt;
  // dificultat creixent
  speed = 80 + t * 6;
  spawnEvery = Math.max(0.22, 0.7 - t * 0.012);

  // moviment
  const P = SIZE.player, MAXV = 140;
  let dir = (keys.right?1:0) - (keys.left?1:0) || touchDir;
  if (dragging) {
    // moviment relatiu: el personatge es mou el mateix que el dit
    dragTarget = Math.max(0, Math.min(W - P.w, dragTarget + dragDX)); dragDX = 0;
    const d = dragTarget - player.x;
    player.x += d * (1 - Math.exp(-dt * SMOOTH));
    player.vx = Math.abs(d) > 0.7 ? Math.sign(d) : 0;
  } else {
    player.vx = dir * MAXV;
    player.x = Math.max(0, Math.min(W - P.w, player.x + player.vx*dt));
  }
  if (player.vx) { player.face = Math.sign(player.vx); player.animT += dt; }
  else player.animT = 0;
  const nf = Math.max(1, IMG.player.length);
  player.frame = Math.floor(player.animT * 8) % nf;

  // objectes
  spawnT += dt;
  if (spawnT >= spawnEvery) { spawnT = 0; spawn(); }
  // pluja extra de VM: n'han de caure unes 10 vegades més que BTC
  vmT += dt;
  if (vmT >= spawnEvery) { vmT = 0; spawn('vm'); }
  const pb = {x: player.x+5, y: GROUND - P.h + 4, w: P.w-10, h: P.h-4};
  for (const it of items) {
    it.y += it.v * dt;
    if (it.amp) { it.ph += it.fr * dt; it.x = Math.max(0, Math.min(W - SIZE[it.type].w, it.x0 + Math.sin(it.ph) * it.amp)); }
    const s = SIZE[it.type];
    if (!it.dead && hit(pb, {x: it.x, y: it.y, w: s.w, h: s.h})) {
      it.dead = true;
      if (it.type === 'candle') { if (hurtT <= 0) { lives--; hurtT = 1; sfx('hit'); } }
      else { got[it.type]++; sfx('coin'); }
    }
    if (it.y > H) it.dead = true;
  }
  items = items.filter(i => !i.dead);
  hurtT -= dt;

  if (got.btc >= GOAL.btc && got.eth >= GOAL.eth && got.vm >= GOAL.vm) {
    state = 'win'; items = []; musicStop(); sfx('win');
    const secs = Math.round(t);
    if (!best || secs < best) { best = secs; try { localStorage.setItem('pv_besttime', best); } catch(e){} }
    msg('');
    document.getElementById('winmsg').innerHTML = 'YOU WIN!\n<small>' + secs + ' s · tap to play</small>';
    return;
  }
  if (lives <= 0) {
    state = 'over'; musicStop(); sfx('over');
    msg('GAME OVER\n<small>Tap to retry</small>');
  }
}


// ---------- CEL ANIMAT (nit -> dia segons el progrés) ----------
const SKY = [ // [progrés, color dalt, color baix]
  [0.00, [11,16,48],   [28,35,80]],
  [0.35, [42,29,90],   [122,61,120]],
  [0.65, [74,95,168],  [242,163,94]],
  [1.00, [95,179,255], [191,230,255]]
];
const lerp = (a,b,k) => a + (b-a)*k;
const mix = (c1,c2,k) => c1.map((v,i) => Math.round(lerp(v,c2[i],k)));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
function skyAt(p){
  for (let i = 1; i < SKY.length; i++) if (p <= SKY[i][0]) {
    const k = (p - SKY[i-1][0]) / (SKY[i][0] - SKY[i-1][0]);
    return [mix(SKY[i-1][1], SKY[i][1], k), mix(SKY[i-1][2], SKY[i][2], k)];
  }
  return [SKY[3][1], SKY[3][2]];
}
let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
const STARS = Array.from({length: 45}, () => ({x: Math.floor(rnd()*W), y: Math.floor(rnd()*(H*0.6)), b: rnd(), ph: rnd()*6}));
const HILLS = Array.from({length: W}, (_, x) => Math.round(28 + 10*Math.sin(x/23) + 6*Math.sin(x/9 + 1) + 3*Math.sin(x/4)));
let skyP = 0, clock = 0;
const moonCv = document.createElement('canvas'); moonCv.width = moonCv.height = 24; const moonCtx = moonCv.getContext('2d');
const silCv = document.createElement('canvas'); silCv.width = W; silCv.height = H; const silCtx = silCv.getContext('2d');
function disc(cx, cy, r, color){
  ctx.fillStyle = color;
  for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r*r - dy*dy)); ctx.fillRect(cx - w, cy + dy, w*2 + 1, 1); }
}
function drawSky(dt){
  const target = state === 'win' ? 1 : state === 'menu' ? 0 : progress();
  skyP += (target - skyP) * Math.min(1, dt * 1.5);
  clock += dt;
  const [top, bot] = skyAt(skyP), BANDS = 20, bh = Math.ceil(GROUND / BANDS);
  for (let i = 0; i < BANDS; i++) { ctx.fillStyle = rgb(mix(top, bot, i/(BANDS-1))); ctx.fillRect(0, i*bh, W, bh); }
  // estreles
  const sa = Math.max(0, 1 - skyP*1.7);
  if (sa > 0) for (const st of STARS) {
    const a = sa * (0.4 + 0.6*st.b) * (0.7 + 0.3*Math.sin(clock*2 + st.ph));
    ctx.fillStyle = `rgba(255,255,230,${a.toFixed(2)})`; ctx.fillRect(st.x, st.y, 1, 1);
  }
  // lluna (se'n va) i sol (ix)
  const ma = Math.max(0, 1 - skyP*2);
  if (ma > 0) {
    moonCtx.clearRect(0,0,24,24); moonCtx.globalCompositeOperation = 'source-over';
    { const c = ctx; ctx = moonCtx; disc(11, 11, 9, '#f4f1d8'); moonCtx.globalCompositeOperation = 'destination-out'; disc(15, 8, 8, '#000'); ctx = c; }
    ctx.globalAlpha = ma; ctx.drawImage(moonCv, 139, 29); ctx.globalAlpha = 1;
  }
  const sp = Math.max(0, (skyP - 0.35) / 0.65);
  if (sp > 0) disc(140, Math.round(lerp(GROUND + 10, 70, sp)), 13, rgb(mix([255,110,50],[255,240,160], sp)));
  // silueta (Roque Nublo), tenyida segons l'hora
  const silCol = rgb(mix([16,14,40], [92,80,70], skyP));
  if (ready(IMG.sil)) {
    silCtx.clearRect(0,0,W,H); silCtx.globalCompositeOperation = 'source-over'; silCtx.drawImage(IMG.sil, 0, 0);
    silCtx.globalCompositeOperation = 'source-in'; silCtx.fillStyle = silCol; silCtx.fillRect(0,0,W,H);
    ctx.drawImage(silCv, 0, 0);
  } else { ctx.fillStyle = silCol; for (let x = 0; x < W; x++) ctx.fillRect(x, GROUND - HILLS[x], 1, HILLS[x]); }
  ctx.fillStyle = rgb(mix([30,28,60], [90,140,80], skyP)); ctx.fillRect(0, GROUND, W, H - GROUND);
}
function progress(){
  if (!got) return 0;
  return (Math.min(1, got.btc/GOAL.btc) + Math.min(1, got.eth/GOAL.eth) + Math.min(1, got.vm/GOAL.vm)) / 3;
}

// ---------- DIBUIX ----------
function drawThing(img, x, y, w, h, color, flip){
  x = Math.round(x); y = Math.round(y);
  if (ready(img)) {
    if (flip) { ctx.save(); ctx.scale(-1,1); ctx.drawImage(img, -x-w, y, w, h); ctx.restore(); }
    else ctx.drawImage(img, x, y, w, h);
  } else { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }
}
function draw(dt){
  drawSky(dt);
  if (ready(IMG.bg)) ctx.drawImage(IMG.bg, 0, 0, W, H);   // silueta del jugador (PNG amb cel transparent)

  if (state === 'win') {
    if (ready(IMG.final)) ctx.drawImage(IMG.final, 0, 70, 192, 176);
  } else if (state !== 'menu') {
    ctx.fillStyle = 'rgba(230,230,240,0.6)';
    for (const it of items) if (it.type === 'candle' && it.y > 0) {   // fil de pescar, penjat d'un punt fix
      const ax = it.x0 + 5, bx = Math.round(it.x) + 5, by = Math.round(it.y);
      for (let y = 0; y < by; y++) ctx.fillRect(Math.round(ax + (bx - ax) * y / by), y, 1, 1);
    }
    for (const it of items) { const s = SIZE[it.type]; drawThing(IMG[it.type], it.x, it.y, s.w, s.h, COL[it.type]); }
    const P = SIZE.player;
    const blink = hurtT > 0 && Math.floor(hurtT*12) % 2;
    if (!blink) drawThing(IMG.player[player.frame], player.x, GROUND - P.h, P.w, P.h, COL.player, false);
  }
  const on = state !== 'menu';
  const fmt = (n, g) => n >= g ? '✓' : '';
  document.getElementById('cbtc').textContent = on ? 'BTC ' + (Math.min(got.btc, GOAL.btc)/10).toFixed(1) + '/1' + fmt(got.btc, GOAL.btc) : '';
  document.getElementById('ceth').textContent = on ? 'ETH ' + Math.min(got.eth, GOAL.eth) + '/10' + fmt(got.eth, GOAL.eth) : '';
  document.getElementById('cvm').textContent  = on ? 'VM ' + Math.min(got.vm, GOAL.vm)*10 + '/1000' + fmt(got.vm, GOAL.vm) : '';
  document.getElementById('lives').textContent = on ? '♥'.repeat(Math.max(0,lives)) : '';
  document.getElementById('rec').textContent = best ? 'BEST ' + best + ' s' : '';
}
const msgEl = document.getElementById('msg');
function msg(html){ msgEl.innerHTML = html; }

// ---------- BUCLE ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  update(dt); musicTick(); draw(dt);
  requestAnimationFrame(loop);
}
reset();
msg('MARAVILLOSO\nVIDEOJUEGO\n<small>Tap to start</small>');
requestAnimationFrame(loop);
})();
</script>
